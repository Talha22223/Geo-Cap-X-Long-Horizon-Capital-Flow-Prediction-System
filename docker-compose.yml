version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: geocapx-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geocapx
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: geocapx-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: geocapx-api
    restart: always
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/geocapx?schema=public
      JWT_SECRET: geocap-x-enterprise-default-secret-token-key
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: geocapx-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: docker/ai.Dockerfile
    container_name: geocapx-ai
    restart: always
    ports:
      - '8000:8000'
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/geocapx?schema=public
      REDIS_URL: redis://redis:6379/1
      NLP_PROVIDER: spacy
      SPACY_MODEL: en_core_web_sm
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    image: nginx:1.25-alpine
    container_name: geocapx-proxy
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - ai

volumes:
  pgdata:
  redisdata:
